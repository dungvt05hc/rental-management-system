    <!--
      Preload đúng hai file cần cho lần vẽ đầu tiên: weight 400 của Be Vietnam

      Không preload Inter: số chỉ xuất hiện sau khi dữ liệu từ API về, lúc đó
      font đã kịp tải. Preload thêm 58KB sẽ tranh băng thông với chính lần gọi
      API đó trên mạng 4G yếu.
    -->
    <link rel="preload" href="/fonts/bvp-400-vi.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bvp-400-latin.woff2" as="font" type="font/woff2" crossorigin />

    <title>Quản lý nhà trọ</title>
