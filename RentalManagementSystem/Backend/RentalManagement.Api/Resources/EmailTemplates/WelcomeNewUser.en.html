<!-- Placeholder: FullName, Email, LoginLink -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your account is ready</title>
</head>
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;">
    <tr>
      <td style="padding:32px;">
        <p style="margin:0 0 16px;font-size:16px;">Hi {{FullName}},</p>

        <p style="margin:0 0 16px;font-size:15px;line-height:1.6;">
          Your account on the rental management system has been created. Sign in
          with this email address:
        </p>

        <p style="margin:0 0 24px;font-size:15px;">
          <strong>{{Email}}</strong>
        </p>

        <p style="margin:24px 0;">
          <a href="{{LoginLink}}" style="display:inline-block;padding:12px 24px;background:#2563eb;color:#ffffff;text-decoration:none;border-radius:6px;font-size:15px;">Sign in</a>
        </p>

        <p style="margin:0 0 16px;font-size:15px;line-height:1.6;">
          On your first sign-in, replace the password your administrator issued
          with one only you know.
        </p>

        <p style="margin:24px 0 0;font-size:13px;color:#6b7280;line-height:1.6;">
          Button not working? Copy this link into your browser:<br>
          <span style="word-break:break-all;">{{LoginLink}}</span>
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
